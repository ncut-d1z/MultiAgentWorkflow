[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-workflow"
version = "0.1.0"
description = "Deterministic Manager -> Worker -> Reviewer orchestration over Codex CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ncut-d1z"}]
dependencies = []
keywords = ["agents", "codex", "multi-agent", "orchestration", "review"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
maw = "multiagent_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
